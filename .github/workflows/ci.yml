name: SONGYU checks
on:
  pull_request:
  push:
    branches: [main, 'feature/frontend-*', 'feature/backend-*', 'codex/**']
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e:mock
      - name: Real HTTP and browser checks without optional local engines
        run: npm run test:e2e -- --grep-invert "FluidSynth|real Qixuan|FFmpeg"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            mock-test-results/
